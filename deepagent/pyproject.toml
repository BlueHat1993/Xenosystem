[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent"
version = "0.1.0.dev0"
description = "Deepseek powered deepagent for Xenosystem"
requires-python = ">=3.10"
dependencies = [
  "deepagents",
  "langchain",
  "langchain-core",
  "langchain-deepseek",
  "langchain-community",
  "tavily-python",
  "ddgs",
  "langchain-mcp-adapters",
  "python-dotenv",
  "httpx",
]

[project.scripts]
deepagent = "deepagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
