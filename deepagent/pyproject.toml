[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent"
version = "0.1.0-draft"
description = "Draft DeepSeek-powered research agent (Deep Agents style)"
requires-python = ">=3.10"
dependencies = [
  "deepagents",
  "langchain",
  "langchain-core",
  "langchain-deepseek",
  "langchain-community",
  "tavily-python",
  "ddgs",
  "langchain-mcp-adapters",
  "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
